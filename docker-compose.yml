# Production compose (used by Coolify). Postgres runs elsewhere and is reached
# via the DATABASE_URL env var.
#
# A single `web` container serves the UI AND runs the polling scheduler (the
# entrypoint starts it in the background), so no separate worker is needed. The
# entrypoint also runs `prisma migrate deploy` before starting.
#
# Coolify injects environment variables itself; for a plain `docker compose up`
# provide them via a .env file next to this one (see .env.example).

services:
  web:
    image: ghcr.io/darkbluellc/dialert:latest
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional: run polling in a dedicated container instead of in-process.
  # If you enable this, set RUN_SCHEDULER=false on the web service above.
  #
  # worker:
  #   image: ghcr.io/darkbluellc/dialert:latest
  #   restart: always
  #   command: npm run worker
  #   environment:
  #     RUN_MIGRATIONS: "false"
  #   env_file:
  #     - .env
  #   depends_on:
  #     web:
  #       condition: service_healthy
