# Production compose (used by Coolify). Postgres runs elsewhere and is reached
# via the DATABASE_URL env var. Both services use the same prebuilt image from
# GHCR; only the command differs.
#
# Coolify injects environment variables itself; for a plain `docker compose up`
# provide them via a .env file next to this one (see .env.example).

services:
  web:
    image: ghcr.io/darkbluellc/dialert:latest
    restart: always
    # Apply migrations, then start the web server.
    command: sh -c "npx prisma migrate deploy && npm run start"
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ghcr.io/darkbluellc/dialert:latest
    restart: always
    command: npm run worker
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy
